[package]
name = "vone-studio"
version = "0.1.0"
description = "V-ONE Studio - shell desktop (Tauri) da mesma UI web/PWA"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "vone-studio"
path = "src/main.rs"
